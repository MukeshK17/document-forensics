[tool.ruff]
line-length = 88
extend-exclude = ["archive", "colab/*.ipynb"]

[tool.ruff.lint]
select = ["F", "E", "W", "I"]
# E501: Ignore long lines
# F841: Ignore unused local variables (Add this if you want it globally disabled)
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tools/*" = ["F841"]
"tests/*" = ["F841"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
