# Pipeline information
pipeline:
  name: "FakeDocDetector"
  version: "1.0.0"
  environment: "production"          # current running environment (e.g. development, staging, production)
  log_level: "INFO"                  # logging level for the pipeline (e.g. DEBUG, INFO, WARNING, ERROR)


# Device & runtime
runtime:
  device: "auto"                     # (auto, cpu, cuda, cuda:0, mps)
  # "auto" resolves to the first available CUDA device, then MPS, then CPU.
  mixed_precision: true              # Use torch.autocast where supported
  num_workers: 4                     # DataLoader workers for parallel processing(adjusted based on CPU cores)
  seed: 42


# LayoutLMv3 — Document Classification & KIE
layoutlmv3:
  # Pretrained model name or path to the saved model folder.
  # Can replace this with a local checkpoint path after fine-tuning.
  pretrained_model_name_or_path: "microsoft/layoutlmv3-base"

  # Label mapping — must match the id2label dict used during fine-tuning.
  # Index order must align with the model's classifier head.
  id2label:
    0: "PAN_CARD"
    1: "AADHAR_CARD"
    2: "BANK_STATEMENT"
    3: "SALARY_SLIP"
    4: "ITR_FORM"
    5: "UNKNOWN"

  # Processor / tokenizer settings
  processor:
    apply_ocr: false          # Pre-extracted words & boxes from PaddleOCR
    max_seq_length: 512
    padding: "max_length"
    truncation: true

  # Inference settings
  inference:
    batch_size: 1             # Single-document inference in the async pipeline
    image_size: [224, 224]    # [H, W] expected by the LayoutLMv3 image encoder


# Risk Thresholds:
# Each threshold is the MINIMUM confidence score required before a document
# is accepted as genuine.  Scores below the threshold escalate to the next
# review tier.
risk_thresholds:
  auto_approve: 0.92          # >= this → automatic approval, no human review
  manual_review: 0.70         # >= this and < auto_approve → queue for analyst
  auto_reject: 0.50           # < manual_review → automatic rejection / flag
  # Documents with confidence exactly equal to a boundary use the stricter tier.


# Ensemble Confidence Weights

# The final risk score is a weighted average of signals from each module.
# Weights must sum to 1.0.  Adjust after calibration on your validation set.
ensemble_weights:
  layoutlmv3_classification: 0.35   # Document type + KIE confidence
  cnn_tampering_detection:   0.40   # Pixel-level forgery score
  regex_rules_engine:        0.25   # Semantic / mathematical validation


# CNN Tampering Detector (placeholder — populated when module is ready)

cnn_tampering:
  pretrained_model_name_or_path: null   # e.g. "./checkpoints/ela-resnet50"
  input_size: [256, 256]
  ela_quality: 90                        # JPEG quality for Error Level Analysis

# Document Ingestion

ingestion:
  pdf_dpi: 200              # DPI for PDF rasterisation (200 = good OCR quality)
  max_pages: 5              # Max pages to load per PDF (null = all pages)

# OCR — PaddleOCR (placeholder — populated when module is ready)

paddleocr:
  lang: "en"
  use_angle_cls: true
  min_score: 0.35
  use_gpu: true                  # Mirrors runtime.device; resolved at startup
  det_db_thresh: 0.3
  rec_batch_num: 6

# Preprocessing

preprocessing:
  correct_orientation: true  # Tesseract OSD — requires pytesseract on PATH
  deskew: true               # Hough-line skew correction
  denoise: true              # Non-local means denoising
  normalise_contrast: true   # CLAHE contrast normalisation
  target_size: [1024, 1024]  # [width, height] output canvas

  # Augmentation
  # Each stage has:
  #   enabled : bool  — participates in the pipeline at all
  #   p       : float — probability of firing on any given sample
  augmentation:
    enabled: true            # Master switch — set false to disable all augmentation

    random_rotation:
      enabled: true
      p: 0.5
      max_angle: 5.0         # degrees; simulates crooked scanner placement

    random_perspective:
      enabled: true
      p: 0.3
      distortion_scale: 0.05 # 0.05 = subtle warp; 0.10 = clearly warped

    random_brightness:
      enabled: true
      p: 0.5
      factor_range: [0.7, 1.3]

    random_contrast:
      enabled: true
      p: 0.5
      factor_range: [0.7, 1.3]

    random_gaussian_blur:
      enabled: true
      p: 0.4
      radius_range: [0.5, 2.0]

    random_jpeg_compression:
      enabled: true
      p: 0.5
      quality_range: [40, 85] # Lower = more artefacts

    random_noise:
      enabled: true
      p: 0.4
      std_range: [5.0, 25.0]  # pixel intensity units (0–255)

    random_shadow:
      enabled: true
      p: 0.3
      alpha_range: [0.3, 0.7]
      width_fraction: 0.35    # band width as fraction of image width

    random_ink_bleed:
      enabled: true
      p: 0.3
      kernel_size: 2          # dilation kernel; increase for heavier bleed

    random_erode_text:
      enabled: true
      p: 0.3
      kernel_size: 2          # erosion kernel; simulates faded ink

    cutout:
      enabled: true
      p: 0.4
      num_holes: 1
      max_h_ratio: 0.20       # max patch height as fraction of image height
      max_w_ratio: 0.20       # max patch width as fraction of image width


# PatchCore Anomaly Detector
patchcore:
  backbone: "wide_resnet50_2"
  img_size: 320
  extract_layers: ["layer2", "layer3"]
  coreset_ratio: 0.10
  k_neighbours: 9
  bank_path: "data/patchcore_bank.pt"
  score_threshold: 0.55

# DataLoaders

dataloader:
  train_batch_size: 8
  eval_batch_size: 16
  use_weighted_sampler: true  # Up-sample minority classes during training
  pin_memory: true

# Validators — Regex / Mathematical Rules Engine

validators:
  pan_card:
    pan_regex: "^[A-Z]{5}[0-9]{4}[A-Z]{1}$"
    name_min_length: 3
  aadhar_card:
    digit_count: 12
    checksum_algorithm: "verhoeff"   # Verhoeff algorithm for Aadhaar UID
  bank_statement:
    balance_tolerance_inr: 1.0      # Allowable rounding error in closing balance
    date_format: "%d/%m/%Y"


# Output / Audit

output:
  results_dir: "./results"
  save_annotated_images: false    # Flip to true during debugging
  audit_log_path: "./logs/audit.jsonl"

# Smoke Test

smoke_test:
  synthetic_doc:
    image_size: [224, 224]
    background_color: [255, 255, 255]
    text_color: [20, 20, 20]
    border_color: [150, 150, 150]

    doc_types:
      - "AADHAR_CARD"
      - "PAN_CARD"

  preprocessing_overrides:
    target_size: [224, 224]
    correct_orientation: false
    denoise: false

  stages:
    ingest: true
    preprocess_clean: true
    preprocess_augment: true
    ocr: true
    classifier: true
    rules_engine: true
    ensemble: true
    output_writers: true
    dataloader: true

  mocks:
    classifier:
      mock: true
      fake_label: "AADHAR_CARD"
      fake_label_id: 1
      fake_confidence: 0.94
    ocr:
      mock: true

  assertions:
    min_ocr_tokens: 1
    min_rules_score: 0.0
    verdict_must_be_set: true
    csv_row_written: true
    audit_line_written: true
    max_elapsed_ms: 30000
